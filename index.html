<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KısaFilm Sahnesi</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #09090b; color: #ffffff; max-width: 480px; margin: 0 auto; padding-bottom: 140px; }
        
        /* Üst Bar */
        .top-bar { display: flex; align-items: center; gap: 10px; padding: 12px 15px; background: rgba(9, 9, 11, 0.95); position: sticky; top: 0; z-index: 100; border-bottom: 1px solid #18181b; }
        .logo-icon { background: linear-gradient(135deg, #e11d48, #9f1239); color: #fff; width: 34px; height: 34px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: bold; }
        .search-box { flex: 1; background: #18181b; border: 1px solid #27272a; border-radius: 20px; padding: 8px 14px; display: flex; align-items: center; gap: 8px; color: #a1a1aa; }
        .search-box input { background: transparent; border: none; color: white; width: 100%; outline: none; font-size: 12px; }
        .vip-btn { background: linear-gradient(135deg, #f59e0b, #d97706); color: #000; font-weight: 800; font-size: 11px; padding: 7px 11px; border-radius: 20px; position: relative; }
        .vip-badge { position: absolute; top: -7px; right: -2px; background: #e11d48; color: white; font-size: 9px; padding: 1px 5px; border-radius: 8px; }

        /* Sekmeler */
        .tabs { display: flex; justify-content: space-between; align-items: center; padding: 12px 18px; border-bottom: 1px solid #18181b; font-size: 13px; font-weight: 600; color: #71717a; }
        .tabs span.active { color: #fff; border-bottom: 2px solid #e11d48; padding-bottom: 4px; }
        .tabs .gold-tab { color: #fbbf24; font-family: Georgia, serif; }

        /* Vitrin Grid */
        .section-header { display: flex; justify-content: space-between; align-items: center; padding: 14px 15px 4px; }
        .section-header h2 { font-size: 15px; font-weight: 700; display: flex; align-items: center; gap: 6px; }

        .grid-container { display: grid; grid-template-columns: repeat(3, 1fr); gap: 11px; padding: 10px 15px; }
        .card { display: flex; flex-direction: column; cursor: pointer; }
        .poster-wrapper { position: relative; width: 100%; aspect-ratio: 2/3; border-radius: 10px; overflow: hidden; background: #18181b; border: 1px solid #27272a; }
        .poster-wrapper img { width: 100%; height: 100%; object-fit: cover; }
        
        .badge-dub { position: absolute; top: 6px; left: 6px; background: #e11d48; color: white; font-size: 9px; font-weight: 700; padding: 2px 6px; border-radius: 4px; }
        .badge-quality { position: absolute; top: 6px; right: 6px; background: rgba(0,0,0,0.75); color: #fbbf24; font-size: 8px; font-weight: 700; padding: 2px 4px; border-radius: 4px; }
        .views { position: absolute; bottom: 0; left: 0; right: 0; background: linear-gradient(transparent, rgba(0,0,0,0.9)); color: #fff; font-size: 10px; padding: 12px 6px 5px; text-align: right; }
        
        .card-title { font-size: 12px; font-weight: 600; margin-top: 6px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .card-genre { font-size: 10px; color: #71717a; margin-top: 3px; }

        /* Alt Menü */
        .bottom-nav { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 480px; height: 58px; background: #09090b; border-top: 1px solid #18181b; display: flex; justify-content: space-around; align-items: center; z-index: 100; }
        .nav-item { display: flex; flex-direction: column; align-items: center; gap: 3px; color: #71717a; font-size: 10px; text-decoration: none; }
        .nav-item.active { color: #e11d48; }

        /* Stüdyo ve Oynatıcı */
        .ai-fab { position: fixed; bottom: 75px; right: 16px; background: linear-gradient(135deg, #e11d48, #4f46e5); color: white; border: none; border-radius: 50px; padding: 12px 18px; font-weight: 700; font-size: 13px; display: flex; align-items: center; gap: 8px; box-shadow: 0 4px 20px rgba(225, 29, 72, 0.6); cursor: pointer; z-index: 101; }
        .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.92); backdrop-filter: blur(8px); z-index: 200; align-items: center; justify-content: center; padding: 15px; }
        .studio-box { background: #141417; border: 1px solid #27272a; border-radius: 18px; width: 100%; max-width: 430px; padding: 18px; color: white; max-height: 92vh; overflow-y: auto; }
        .studio-box h3 { font-size: 16px; margin-bottom: 10px; color: #fbbf24; display: flex; align-items: center; gap: 8px; }
        .studio-box input, .studio-box select, .studio-box textarea { width: 100%; background: #1f1f23; border: 1px solid #3f3f46; color: white; border-radius: 10px; padding: 10px; margin-bottom: 10px; font-size: 13px; outline: none; }
        .btn-primary { width: 100%; background: linear-gradient(90deg, #e11d48, #6366f1); color: white; border: none; padding: 12px; border-radius: 10px; font-weight: 700; font-size: 14px; cursor: pointer; }
        .status-text { font-size: 12px; color: #38bdf8; margin-top: 10px; text-align: center; }

        .lang-bar { display: flex; gap: 8px; margin-top: 8px; align-items: center; }
        .lang-bar select { margin-bottom: 0; padding: 7px; font-size: 12px; background: #27272a; flex: 1; }
        .sub-toggle { font-size: 11px; color: #fbbf24; cursor: pointer; background: #27272a; padding: 7px 10px; border-radius: 8px; border: 1px solid #3f3f46; }
        
        .stage-screen { background: linear-gradient(135deg, #1e1b4b, #31102f); border: 1px solid #333; border-radius: 14px; padding: 14px; margin-top: 10px; position: relative; min-height: 270px; display: flex; flex-direction: column; justify-content: space-between; }
        .stage-content { position: relative; z-index: 2; }
        .subtitle-box { background: rgba(0,0,0,0.75); border-left: 3px solid #e11d48; padding: 10px; border-radius: 8px; font-size: 13px; line-height: 1.5; max-height: 175px; overflow-y: auto; color: #f4f4f5; }
        
        .ep-list { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin-top: 10px; max-height: 170px; overflow-y: auto; }
        .ep-btn { background: #27272a; color: #fff; border: 1px solid #3f3f46; padding: 8px 0; border-radius: 8px; font-size: 12px; font-weight: 600; cursor: pointer; }
        .ep-btn.active { background: #e11d48; border-color: #e11d48; }
    </style>
</head>
<body>

    <header class="top-bar">
        <div class="logo-icon">🎬</div>
        <div class="search-box">
            <span>🔍</span>
            <input type="text" placeholder="KısaFilm Sahnesi'nde ara...">
        </div>
        <div class="vip-btn"><span class="vip-badge">AI</span>👑 SAHNE+</div>
    </header>

    <nav class="tabs">
        <span class="active">VİTRİN</span>
        <span>YENİ</span>
        <span class="gold-tab">Özel Yapımlar</span>
        <span>TOP 10</span>
    </nav>

    <div class="section-header">
        <h2>🔥 KısaFilm Sahnesi Vitrini</h2>
    </div>

    <main class="grid-container" id="mainGrid">
        <div class="card" onclick="openStudio()">
            <div class="poster-wrapper" style="display:flex; align-items:center; justify-content:center; flex-direction:column; text-align:center; padding:10px; border:1px dashed #e11d48;">
                <span style="font-size:28px; margin-bottom:8px;">➕</span>
                <span style="font-size:11px; font-weight:700;">AI Dizi Üret</span>
            </div>
            <div class="card-title">Yeni 55 Bölümlük Dizi Oluştur</div>
            <div class="card-genre">Gemini Stüdyo</div>
        </div>
    </main>

    <footer class="bottom-nav">
        <a href="#" class="nav-item active"><span style="font-size:16px;">🎞️</span><span>Sahne</span></a>
        <a href="#" class="nav-item" onclick="openStudio()"><span style="font-size:16px;">✨</span><span>AI Üret</span></a>
        <a href="#" class="nav-item"><span style="font-size:16px;">🔖</span><span>Listem</span></a>
        <a href="#" class="nav-item"><span style="font-size:16px;">👤</span><span>Profil</span></a>
    </footer>

    <button class="ai-fab" onclick="openStudio()">✨ Gemini AI Stüdyo</button>

    <!-- Stüdyo Modal -->
    <div class="modal-overlay" id="studioModal">
        <div class="studio-box">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
                <h3>🤖 Gemini Dizi Üreticisi</h3>
                <span style="cursor:pointer; color:#888; font-size:18px;" onclick="closeModal('studioModal')">✖</span>
            </div>
            <input type="password" id="geminiKey" placeholder="Gemini API Anahtarı (AIza...)">
            <input type="text" id="seriesTitle" placeholder="Dizi Adı">
            <select id="seriesCount">
                <option value="50">50 Bölüm (2-3 Dk / Bölüm)</option>
                <option value="55" selected>55 Bölüm (2-3 Dk / Bölüm)</option>
                <option value="60">60 Bölüm (2-3 Dk / Bölüm)</option>
            </select>
            <textarea id="seriesPrompt" rows="3" placeholder="Dizinin konusunu yaz..."></textarea>
            <button class="btn-primary" onclick="createSeriesWithGemini()">Diziyi Oluştur</button>
            <div class="status-text" id="studioStatus"></div>
        </div>
    </div>

    <!-- Oynatıcı Modal -->
    <div class="modal-overlay" id="playerModal">
        <div class="studio-box">
            <div style="display:flex; justify-content:space-between; align-items:center;">
                <h3 id="playerTitle" style="font-size:15px;">Dizi Başlığı</h3>
                <span style="cursor:pointer; color:#888; font-size:18px;" onclick="stopSpeech(); closeModal('playerModal')">✖</span>
            </div>

            <div class="lang-bar">
                <select id="langSelect" onchange="reloadCurrentEpisode()">
                    <option value="tr-TR|Türkçe">🇹🇷 Türkçe (Ses & Altyazı)</option>
                    <option value="en-US|English">🇺🇸 English (Audio & Sub)</option>
                    <option value="es-ES|Español">🇪🇸 Español (Audio & Sub)</option>
                    <option value="ko-KR|한국어">🇰🇷 한국어 (음성 및 자막)</option>
                    <option value="ja-JP|日本語">🇯🇵 日本語 (音声と字幕)</option>
                    <option value="de-DE|Deutsch">🇩🇪 Deutsch (Audio & UT)</option>
                    <option value="fr-FR|Français">🇫🇷 Français (Audio & ST)</option>
                    <option value="ar-SA|العربية">🇸🇦 العربية (صوت وترجمة)</option>
                    <option value="ru-RU|Русский">🇷🇺 Русский (Звук и субтитры)</option>
                    <option value="it-IT|Italiano">🇮🇹 Italiano (Audio & Sub)</option>
                    <option value="pt-BR|Português">🇧🇷 Português (Áudio e Legenda)</option>
                    <option value="hi-IN|हिन्दी">🇮🇳 हिन्दी (ऑडियो और उपशीर्षक)</option>
                    <option value="zh-CN|中文">🇨🇳 中文 (语音和字幕)</option>
                </select>
                <button class="sub-toggle" onclick="toggleSubtitles()" id="subToggleBtn">Altyazı: AÇIK</button>
            </div>

            <div class="stage-screen" id="stageScreen">
                <div class="stage-content" style="display:flex; justify-content:space-between; align-items:center;">
                    <span id="currentEpBadge" style="background:#e11d48; padding:3px 8px; border-radius:6px; font-size:11px; font-weight:700;">Bölüm 1</span>
                    <button onclick="toggleSpeech()" id="voiceBtn" style="background:#e11d48; border:none; color:white; padding:6px 12px; border-radius:20px; font-size:11px; font-weight:700; cursor:pointer;">
                        🔊 Dublajı Başlat
                    </button>
                </div>
                <div class="stage-content">
                    <div class="subtitle-box" id="scriptBox">Sahne yükleniyor...</div>
                </div>
            </div>

            <div style="font-size:12px; font-weight:700; margin-top:10px; color:#fbbf24;">Bölümler:</div>
            <div class="ep-list" id="episodeGrid"></div>
        </div>
    </div>

    <script>
        let generatedSeriesList = JSON.parse(localStorage.getItem('kisafilm_series') || '[]');
        let activeSeries = null;
        let currentEpNumber = 1;
        let currentScriptText = "";
        let subtitlesVisible = true;

        window.addEventListener('DOMContentLoaded', () => {
            const savedKey = localStorage.getItem('gemini_api_key');
            if (savedKey) document.getElementById('geminiKey').value = savedKey;
            generatedSeriesList.forEach(series => addSeriesCardToGrid(series));
        });

        function openStudio() { document.getElementById('studioModal').style.display = 'flex'; }
        function closeModal(id) { document.getElementById(id).style.display = 'none'; }

        function toggleSubtitles() {
            subtitlesVisible = !subtitlesVisible;
            document.getElementById('scriptBox').style.display = subtitlesVisible ? 'block' : 'none';
            document.getElementById('subToggleBtn').innerText = subtitlesVisible ? 'Altyazı: AÇIK' : 'Altyazı: KAPALI';
        }

        async function callGemini(apiKey, promptText) {
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`;
            const response = await fetch(url, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ contents: [{ parts: [{ text: promptText }] }] })
            });
            const data = await response.json();
            if (data.error) throw new Error(data.error.message);
            if (!data.candidates || !data.candidates.length) throw new Error("Yapay zeka yanıt döndürmedi.");
            return data.candidates[0].content.parts[0].text;
        }

        function createSeriesWithGemini() {
            const apiKey = document.getElementById('geminiKey').value.trim();
            const title = document.getElementById('seriesTitle').value.trim();
            const count = document.getElementById('seriesCount').value;
            const prompt = document.getElementById('seriesPrompt').value.trim();
            const status = document.getElementById('studioStatus');

            if (!apiKey || !title || !prompt) {
                alert("Lütfen API anahtarını, dizi adını ve konusunu girin!");
                return;
            }

            localStorage.setItem('gemini_api_key', apiKey);
            status.innerText = "✨ Dizi oluşturuluyor...";

            const gradients = [
                "linear-gradient(135deg, #7f1d1d, #1e1b4b)",
                "linear-gradient(135deg, #4c1d95, #0f172a)",
                "linear-gradient(135deg, #831843, #172554)",
                "linear-gradient(135deg, #78350f, #18181b)"
            ];

            const seriesObj = {
                id: Date.now(),
                title: title,
                prompt: prompt,
                count: parseInt(count),
                bg: gradients[Math.floor(Math.random() * gradients.length)]
            };

            generatedSeriesList.push(seriesObj);
            localStorage.setItem('kisafilm_series', JSON.stringify(generatedSeriesList));
            addSeriesCardToGrid(seriesObj);

            status.innerText = "";
            closeModal('studioModal');
            openSeriesPlayer(seriesObj.id);
        }

        function addSeriesCardToGrid(series) {
            const grid = document.getElementById('mainGrid');
            const cardHTML = `
                <div class="card" onclick="openSeriesPlayer(${series.id})">
                    <div class="poster-wrapper" style="background:${series.bg}; display:flex; align-items:center; justify-content:center; padding:8px; text-align:center;">
                        <span style="font-size:13px; font-weight:800; color:#fff; text-shadow:0 2px 6px rgba(0,0,0,0.8);">${series.title}</span>
                        <span class="badge-dub">Çoklu Dil</span>
                        <span class="badge-quality">${series.count} BÖLÜM</span>
                        <span class="views">▶ AI</span>
                    </div>
                    <div class="card-title">${series.title}</div>
                    <div class="card-genre">${series.count} Bölüm • 2-3 Dk</div>
                </div>
            `;
            grid.insertAdjacentHTML('afterbegin', cardHTML);
        }

        function openSeriesPlayer(id) {
            activeSeries = generatedSeriesList.find(s => s.id === id);
            if (!activeSeries) return;

            document.getElementById('playerTitle').innerText = activeSeries.title;
            document.getElementById('stageScreen').style.background = activeSeries.bg;
            
            const epGrid = document.getElementById('episodeGrid');
            epGrid.innerHTML = "";
            for (let i = 1; i <= activeSeries.count; i++) {
                epGrid.innerHTML += `<button class="ep-btn" id="epBtn-${i}" onclick="playEpisode(${i})">${i}</button>`;
            }

            document.getElementById('playerModal').style.display = 'flex';
            playEpisode(1);
        }

        function reloadCurrentEpisode() {
            if (activeSeries) playEpisode(currentEpNumber);
        }

        async function playEpisode(epNum) {
            currentEpNumber = epNum;
            stopSpeech();
            document.querySelectorAll('.ep-btn').forEach(b => b.classList.remove('active'));
            const activeBtn = document.getElementById(`epBtn-${epNum}`);
            if (activeBtn) activeBtn.classList.add('active');

            const langParts = document.getElementById('langSelect').value.split('|');
            const langCode = langParts[0];
            const langName = langParts[1];

            document.getElementById('currentEpBadge').innerText = `Bölüm ${epNum} / ${activeSeries.count}`;
            const scriptBox = document.getElementById('scriptBox');
            scriptBox.innerHTML = `⏳ Gemini ${epNum}. bölümü <b>${langName}</b> dilinde hazırlıyor...`;

            const apiKey = localStorage.getItem('gemini_api_key');
            try {
                const epPrompt = `Sen profesyonel bir dikey kısa dizi senaristisin.
                Dizi Adı: "${activeSeries.title}"
                Ana Konu: ${activeSeries.prompt}
                Bölüm: ${epNum} / ${activeSeries.count} (2-3 dakikalık tempolu bölüm).
                
                KURAL: Tüm sahne anlatımını, diyalogları ve bölüm sonu şok finalini SADECE "${langName}" (${langCode}) dilinde yaz. Sesli okumaya uygun akıcı bir metin olsun.`;

                const script = await callGemini(apiKey, epPrompt);
                currentScriptText = script;
                scriptBox.innerText = script;
            } catch (err) {
                scriptBox.innerText = "Hata: " + err.message;
            }
        }

        function toggleSpeech() {
            if (window.speechSynthesis.speaking) {
                stopSpeech();
                return;
            }
            if (!currentScriptText) return;

            const langCode = document.getElementById('langSelect').value.split('|')[0];
            const utterance = new SpeechSynthesisUtterance(currentScriptText);
            utterance.lang = langCode;
            utterance.rate = 1.0;

            const voices = window.speechSynthesis.getVoices();
            const matchedVoice = voices.find(v => v.lang.toLowerCase().includes(langCode.toLowerCase()));
            if (matchedVoice) utterance.voice = matchedVoice;

            window.speechSynthesis.speak(utterance);
            document.getElementById('voiceBtn').innerHTML = `⏹️ Durdur`;
            
            utterance.onend = () => {
                document.getElementById('voiceBtn').innerHTML = `🔊 Dublajı Başlat`;
            };
        }

        function stopSpeech() {
            window.speechSynthesis.cancel();
            document.getElementById('voiceBtn').innerHTML = `🔊 Dublajı Başlat`;
        }
    </script>
</body>
</html>
